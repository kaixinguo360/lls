[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lls"
dynamic = ["version"]
description = "基于 PTY 的终端包装器：VT100 屏幕模型 + 覆盖层界面"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LLS" }]
dependencies = [
    "pyte>=0.8.2",
    "pyyaml>=5.1",
    "wcwidth>=0.2",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
lls = "lls.cli:main"

# 版本号只在 lls/__init__.py 里写一次
[tool.hatch.version]
path = "src/lls/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lls"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 代码必须能在 3.8 上导入：注解靠 from __future__ import annotations，
# 赋值语句里的类型用 typing 的形式。
[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.8"
files = ["src/lls/term", "src/lls/edit"]
strict = true
