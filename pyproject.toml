[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lls"
version = "0.2.0"
description = "基于 PTY 的终端包装器：VT100 屏幕模型 + 覆盖层界面"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LLS" }]
dependencies = [
    "pyte>=0.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1", "mypy>=1.0"]

[project.scripts]
lls = "lls.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lls"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/lls/term", "src/lls/edit"]
strict = true
